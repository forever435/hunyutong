<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9eb5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffc4d6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffe0ec;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="102" ry="102" fill="url(#bgGradient)"/>
  
  <!-- 心形图标 -->
  <path d="M256 400 C 200 360, 120 300, 120 220 C 120 160, 160 120, 210 120 C 240 120, 256 140, 256 140 C 256 140, 272 120, 302 120 C 352 120, 392 160, 392 220 C 392 300, 312 360, 256 400 Z" 
        fill="url(#heartGradient)" 
        stroke="#ff7a9a" 
        stroke-width="4"/>
  
  <!-- 小心形装饰 -->
  <path d="M180 180 C 170 180, 165 185, 165 192 C 165 200, 175 205, 180 210 C 185 205, 195 200, 195 192 C 195 185, 190 180, 180 180 Z" 
        fill="#ffe0ec" 
        opacity="0.6"/>
  
  <path d="M332 180 C 322 180, 317 185, 317 192 C 317 200, 327 205, 332 210 C 337 205, 347 200, 347 192 C 347 185, 342 180, 332 180 Z" 
        fill="#ffe0ec" 
        opacity="0.6"/>
  
  <!-- 文字：婚育通 -->
  <text x="256" y="450" 
        font-family="Arial, sans-serif" 
        font-size="48" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">
    婚育通
  </text>
</svg>
